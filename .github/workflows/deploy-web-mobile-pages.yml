name: Deploy Case Study to GitHub Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pencil-blade-github-pages
  cancel-in-progress: false

jobs:
  site-build:
    name: Build and verify documentary site
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install exact npm
        shell: bash
        run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund

      - name: Verify protected ref and exact Node/npm
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.6.2"

      - name: Install locked site dependencies
        working-directory: site
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate workflow trust and publication snapshot
        shell: bash
        run: |
          set -euo pipefail
          node site/scripts/validate-workflow-trust.mjs \
            .github/workflows/test-case-study-site.yml \
            .github/workflows/deploy-web-mobile-pages.yml
          node scripts/validate-case-study-publication.mjs \
            --manifest reference/case-study-publication-manifest.json \
            --verify-snapshot

      - name: Validate and test site source
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix site run prepare:data
          npm --prefix site run validate:content
          npm --prefix site run check
          node --test \
            tests/case-study-chapters.test.mjs \
            tests/case-study-content.test.mjs \
            tests/case-study-design-system.test.mjs \
            tests/case-study-publication-policy.test.mjs \
            tests/generate-case-study-data.test.mjs \
            tests/play-launcher.test.mjs

      - name: Build site twice and require identical bytes
        shell: bash
        run: |
          set -euo pipefail
          hash_site_tree() {
            node --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readdirSync, readFileSync } from "node:fs";
              import { relative, resolve } from "node:path";
              const root = resolve("site/dist");
              const files = [];
              const visit = (directory) => {
                for (const entry of readdirSync(directory, { withFileTypes: true })) {
                  const path = resolve(directory, entry.name);
                  if (entry.isDirectory()) visit(path);
                  else if (entry.isFile()) files.push(path);
                  else throw new Error(`unsafe site output: ${path}`);
                }
              };
              visit(root);
              const digest = createHash("sha256");
              for (const path of files.sort()) {
                digest.update(relative(root, path).replaceAll("\\\\", "/"));
                digest.update("\\0");
                digest.update(createHash("sha256").update(readFileSync(path)).digest());
                digest.update("\\0");
              }
              process.stdout.write(digest.digest("hex"));
            '
          }
          npm --prefix site run build
          first_digest=$(hash_site_tree)
          rm -rf site/dist
          npm --prefix site run build
          second_digest=$(hash_site_tree)
          test "$first_digest" = "$second_digest"
          printf 'Deterministic site tree: %s\n' "$second_digest"

      - name: Install locked Playwright Chromium
        working-directory: site
        shell: bash
        run: npx --no-install playwright install --with-deps chromium

      - name: Run documentary browser checks
        working-directory: site
        shell: bash
        run: npm run test:browser

      - name: Upload immutable site input
        id: site-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: case-study-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  game-build:
    name: Build and audit raw Cocos H5
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - cocos-creator-3.8.8
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      COCOS_CREATOR_APP: /Applications/Cocos/Creator/3.8.8/CocosCreator.app
      COCOS_CREATOR_BIN: /Applications/Cocos/Creator/3.8.8/CocosCreator.app/Contents/MacOS/CocosCreator
      COCOS_CREATOR_BIN_SHA256: 3a8452496c03e85f2784e64679a1fd203701b0b245125efee02c7923f2bd3464
      WEB_BUILD_DIR: game/build/web-mobile-pages

    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install exact npm
        shell: bash
        run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund

      - name: Verify protected ref and pinned Creator toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.6.2"
          test -x "$COCOS_CREATOR_BIN"
          test -x /opt/homebrew/bin/gtar
          creator_version=$(
            /usr/bin/plutil \
              -extract CFBundleShortVersionString \
              raw \
              -o - \
              "$COCOS_CREATOR_APP/Contents/Info.plist"
          )
          test "$creator_version" = "3.8.8"
          creator_sha256=$(/usr/bin/shasum -a 256 "$COCOS_CREATOR_BIN" | /usr/bin/cut -d ' ' -f 1)
          test "$creator_sha256" = "$COCOS_CREATOR_BIN_SHA256"

      - name: Install locked game dependencies only
        working-directory: game
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build raw H5 twice and require identical bytes
        shell: bash
        run: |
          set -euo pipefail
          build_game() {
            expected_output="$GITHUB_WORKSPACE/game/build/web-mobile-pages"
            test "$GITHUB_WORKSPACE/$WEB_BUILD_DIR" = "$expected_output"
            if test -e "$expected_output"; then
              test -d "$expected_output"
              test ! -L "$expected_output"
              /bin/rm -rf "$expected_output"
            fi
            set +e
            "$COCOS_CREATOR_BIN" \
              --project "$GITHUB_WORKSPACE/game" \
              --build "stage=build;configPath=$GITHUB_WORKSPACE/game/build-configs/web-mobile-pages.json;"
            creator_status=$?
            set -e
            case "$creator_status" in
              36)
                printf 'Cocos Creator Web Mobile build succeeded (exit 36).\n'
                ;;
              32)
                printf 'Cocos Creator rejected the build parameters (exit 32).\n' >&2
                exit 32
                ;;
              34)
                printf 'Cocos Creator reported a build failure (exit 34).\n' >&2
                exit 34
                ;;
              *)
                printf 'Unexpected Cocos Creator exit code: %s\n' "$creator_status" >&2
                exit 1
                ;;
            esac
          }
          hash_game_tree() {
            BUILD_ROOT="$WEB_BUILD_DIR" node --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readdirSync, readFileSync } from "node:fs";
              import { relative, resolve } from "node:path";
              const root = resolve(process.env.BUILD_ROOT);
              const files = [];
              const visit = (directory) => {
                for (const entry of readdirSync(directory, { withFileTypes: true })) {
                  const path = resolve(directory, entry.name);
                  if (entry.isDirectory()) visit(path);
                  else if (entry.isFile()) files.push(path);
                  else throw new Error(`unsafe game output: ${path}`);
                }
              };
              visit(root);
              const digest = createHash("sha256");
              for (const path of files.sort()) {
                digest.update(relative(root, path).replaceAll("\\\\", "/"));
                digest.update("\\0");
                digest.update(createHash("sha256").update(readFileSync(path)).digest());
                digest.update("\\0");
              }
              process.stdout.write(digest.digest("hex"));
            '
          }
          build_game
          first_digest=$(hash_game_tree)
          build_game
          second_digest=$(hash_game_tree)
          test "$first_digest" = "$second_digest"
          printf 'Deterministic raw-game tree: %s\n' "$second_digest"

      - name: Run exact game-owned release tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-creator-iterable-spreads.mjs \
            --typescript "$COCOS_CREATOR_APP/Contents/Resources/app.asar.unpacked/node_modules/typescript/lib/typescript.js"
          node scripts/run-game-release-tests.mjs \
            --manifest reference/game-release-test-manifest.json
          node "$COCOS_CREATOR_APP/Contents/Resources/app.asar.unpacked/node_modules/typescript/lib/tsc.js" \
            -p game/tsconfig.json \
            --pretty false \
            --noEmit
          node scripts/validate-case-study-publication.mjs \
            --manifest reference/case-study-publication-manifest.json \
            --verify-snapshot

      - name: Audit isolated raw H5 tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-web-build.mjs "$WEB_BUILD_DIR"
          node scripts/verify-web-mobile-build.mjs "$WEB_BUILD_DIR" \
            --pages-prefix /pencil-blade-2026/ \
            --entry-path index.html

      - name: Upload immutable raw-game input
        id: game-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: case-study-game-${{ github.run_id }}-${{ github.run_attempt }}
          path: game/build/web-mobile-pages
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  compose-pages:
    name: Compose and audit immutable Pages candidate
    needs:
      - site-build
      - game-build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      content-tree-digest: ${{ steps.release.outputs.content-tree-digest }}
      tree-manifest-digest: ${{ steps.release.outputs.tree-manifest-digest }}
      candidate-artifact-name: ${{ steps.release.outputs.candidate-artifact-name }}
      approval-artifact-name: ${{ steps.release.outputs.approval-artifact-name }}
      candidate-run-attempt: ${{ steps.release.outputs.candidate-run-attempt }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install exact npm
        shell: bash
        run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund

      - name: Verify protected ref and exact Node/npm
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.6.2"

      - name: Initialize ephemeral candidate paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'SITE_DIST=%s/site-dist\n' "$RUNNER_TEMP"
            printf 'GAME_DIST=%s/game-dist\n' "$RUNNER_TEMP"
            printf 'CANDIDATE_DIR=%s/case-study-pages\n' "$RUNNER_TEMP"
            printf 'NONDEPLOYABLE_DIR=%s/case-study-review\n' "$RUNNER_TEMP"
            printf 'REVIEW_REPORT_DIR=%s/case-study-work\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Install locked composition and browser dependencies
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: Download current-run site input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: case-study-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-dist

      - name: Download current-run raw-game input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: case-study-game-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/game-dist

      - name: Compose and audit candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SITE_DIST/index.html"
          test -f "$SITE_DIST/play/index.html"
          test -f "$GAME_DIST/index.html"
          mkdir -p "$REVIEW_REPORT_DIR"
          node scripts/compose-case-study-pages.mjs \
            --site-dist "$SITE_DIST" \
            --game-dist "$GAME_DIST" \
            --out-dir "$CANDIDATE_DIR"
          node scripts/audit-case-study-build.mjs \
            --candidate-dir "$CANDIDATE_DIR" \
            --publication-manifest reference/case-study-publication-manifest.json \
            | tee "$REVIEW_REPORT_DIR/candidate-audit.txt"
          node scripts/verify-case-study-pages.mjs \
            --candidate-dir "$CANDIDATE_DIR" \
            --pages-prefix /pencil-blade-2026/ \
            --publication-manifest reference/case-study-publication-manifest.json

      - name: Run raw and nested H5 runtime matrices
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-h5-runtime-matrix.mjs \
            --build-dir "$GAME_DIST" \
            --pages-prefix /pencil-blade-2026/ \
            --entry-path index.html \
            --report-dir "$REVIEW_REPORT_DIR/runtime-raw" \
            --playwright-module-dir site/node_modules/playwright \
            --ci
          node scripts/run-h5-runtime-matrix.mjs \
            --build-dir "$CANDIDATE_DIR/play/game" \
            --pages-prefix /pencil-blade-2026/play/game/ \
            --entry-path index.html \
            --report-dir "$REVIEW_REPORT_DIR/runtime-nested" \
            --playwright-module-dir site/node_modules/playwright \
            --ci

      - name: Generate release manifests and approval request
        id: release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NONDEPLOYABLE_DIR"
          node scripts/generate-case-study-release-manifest.mjs \
            --candidate-dir "$CANDIDATE_DIR" \
            --site-dist "$SITE_DIST" \
            --game-dist "$GAME_DIST" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --toolchain reference/case-study-build-toolchain.json \
            --publication-manifest reference/case-study-publication-manifest.json
          content_tree_digest=$(
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
              if (!/^[0-9a-f]{64}$/.test(release.content?.contentTreeDigest)) process.exit(1);
              process.stdout.write(release.content.contentTreeDigest);
            ' "$CANDIDATE_DIR/case-study-release.json"
          )
          tree_manifest_digest=$(sha256sum "$CANDIDATE_DIR/case-study-tree-manifest.json" | cut -d ' ' -f 1)
          node scripts/run-case-study-production-smoke.mjs \
            --candidate-dir "$CANDIDATE_DIR" \
            --expected-commit "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-content-digest "$content_tree_digest" \
            --expected-tree-manifest-digest "$tree_manifest_digest" \
            --playwright-module-dir site/node_modules/playwright \
            --report-dir "$REVIEW_REPORT_DIR/candidate-smoke" \
            --ci
          requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          qa_artifact_name="case-study-qa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/case-study-approval.mjs prepare \
            --release "$CANDIDATE_DIR/case-study-release.json" \
            --tree-manifest-digest "$tree_manifest_digest" \
            --requested-at "$requested_at" \
            --checklist owner-candidate-review \
            --checklist editorial-factual-review \
            --checklist vietnamese-factual-review \
            --checklist rights-and-attribution-review \
            --checklist accessibility-and-performance-review \
            --report "$qa_artifact_name/candidate-audit.txt" \
            --report "$qa_artifact_name/runtime-nested/case-study-h5-runtime-matrix.json" \
            --report "$qa_artifact_name/candidate-smoke/case-study-production-smoke.json" \
            --out "$NONDEPLOYABLE_DIR/candidate-approval-request.json"
          node scripts/case-study-approval.mjs verify \
            --release "$CANDIDATE_DIR/case-study-release.json" \
            --tree-manifest-digest "$tree_manifest_digest" \
            --request "$NONDEPLOYABLE_DIR/candidate-approval-request.json"
          candidate_artifact_name="case-study-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          approval_artifact_name="case-study-approval-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            printf 'content-tree-digest=%s\n' "$content_tree_digest"
            printf 'tree-manifest-digest=%s\n' "$tree_manifest_digest"
            printf 'candidate-artifact-name=%s\n' "$candidate_artifact_name"
            printf 'approval-artifact-name=%s\n' "$approval_artifact_name"
            printf 'candidate-run-attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          {
            printf '## Immutable Pages candidate\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Candidate artifact: `%s`\n' "$candidate_artifact_name"
            printf -- '- Content tree digest: `%s`\n' "$content_tree_digest"
            printf -- '- Tree manifest digest: `%s`\n' "$tree_manifest_digest"
            printf -- '- Mounts: `/pencil-blade-2026/`, `/pencil-blade-2026/play/game/`\n'
            printf '\nProtected `github-pages` approval must match both digests.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable candidate for owner review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: case-study-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/case-study-pages
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload nondeployable approval request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: case-study-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/case-study-review/candidate-approval-request.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload nondeployable candidate QA reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: case-study-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/case-study-work
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/case-study-pages

  deploy-pages:
    name: Deploy protected Pages candidate
    needs:
      - compose-pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Verify protected Pages environment policy before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          environment_record="$RUNNER_TEMP/github-pages-environment.json"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/github-pages" \
            --output "$environment_record"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const environment = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const reviewerRule = environment.protection_rules?.find(
              (rule) => rule.type === "required_reviewers",
            );
            const configuredReviewer =
              reviewerRule?.reviewers?.[0]?.reviewer?.login?.toLowerCase();
            if (
              environment.name !== "github-pages"
              || !reviewerRule
              || reviewerRule.prevent_self_review !== false
              || !Array.isArray(reviewerRule.reviewers)
              || reviewerRule.reviewers.length !== 1
              || configuredReviewer !== process.env.GITHUB_ACTOR.toLowerCase()
            ) {
              throw new Error(
                "github-pages must require the triggering solo owner as its human reviewer.",
              );
            }
            if (
              environment.deployment_branch_policy?.protected_branches !== true
              || environment.deployment_branch_policy?.custom_branch_policies !== false
            ) {
              throw new Error(
                "github-pages must allow only protected branches; this workflow separately requires main.",
              );
            }
          ' "$environment_record"

      - name: Deploy approved same-run Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

  record-approval-evidence:
    name: Record authenticated environment approval
    needs:
      - compose-pages
      - deploy-pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: read

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install exact npm
        shell: bash
        run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund

      - name: Initialize ephemeral evidence paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'EVIDENCE_CANDIDATE=%s/evidence-candidate\n' "$RUNNER_TEMP"
            printf 'EVIDENCE_REQUEST=%s/evidence-request\n' "$RUNNER_TEMP"
            printf 'EVIDENCE_OUTPUT=%s/deployment-approval-evidence\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Download exact reviewed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.compose-pages.outputs.candidate-artifact-name }}
          path: ${{ runner.temp }}/evidence-candidate

      - name: Download exact approval request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.compose-pages.outputs.approval-artifact-name }}
          path: ${{ runner.temp }}/evidence-request

      - name: Fetch authenticated environment review history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.6.2"
          mkdir -p "$EVIDENCE_OUTPUT"
          github_api_get() {
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$1" \
              --output "$2"
          }
          github_api_get \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            "$EVIDENCE_OUTPUT/approvals-api.json"
          github_api_get \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            "$EVIDENCE_OUTPUT/run-api.json"
          github_api_get \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=github-pages&per_page=100" \
            "$EVIDENCE_OUTPUT/deployments-api.json"
          mkdir "$EVIDENCE_OUTPUT/deployment-statuses"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const deployments = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const run = JSON.parse(readFileSync(process.argv[2], "utf8"));
            const runStartedAt = Date.parse(run.run_started_at);
            if (!Number.isFinite(runStartedAt)) {
              throw new Error("Authenticated workflow run has no valid run_started_at.");
            }
            const ids = deployments
              .filter(
                (record) =>
                  record.sha === process.env.GITHUB_SHA
                  && record.environment === "github-pages"
                  && Number.isInteger(record.id)
                  && Date.parse(record.created_at) >= runStartedAt,
              )
              .map((record) => record.id);
            if (ids.length === 0) {
              throw new Error("No current-attempt github-pages deployment was found.");
            }
            writeFileSync(process.argv[3], `${ids.join("\n")}\n`, { flag: "wx" });
          ' \
            "$EVIDENCE_OUTPUT/deployments-api.json" \
            "$EVIDENCE_OUTPUT/run-api.json" \
            "$EVIDENCE_OUTPUT/deployment-ids.txt"
          while IFS= read -r deployment_id; do
            github_api_get \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=100" \
              "$EVIDENCE_OUTPUT/deployment-statuses/$deployment_id.json"
          done < "$EVIDENCE_OUTPUT/deployment-ids.txt"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const ids = readFileSync(process.argv[1], "utf8").trim().split("\n");
            const records = ids.map((id) => ({
              deploymentId: Number(id),
              statuses: JSON.parse(
                readFileSync(`${process.argv[2]}/${id}.json`, "utf8"),
              ),
            }));
            writeFileSync(process.argv[3], `${JSON.stringify(records, null, 2)}\n`, {
              flag: "wx",
            });
          ' \
            "$EVIDENCE_OUTPUT/deployment-ids.txt" \
            "$EVIDENCE_OUTPUT/deployment-statuses" \
            "$EVIDENCE_OUTPUT/deployment-statuses-api.json"

      - name: Normalize authenticated provider records
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const [
              approvalsPath,
              runRecordPath,
              deploymentsPath,
              statusesPath,
              releasePath,
              requestPath,
              outputPath,
            ] = process.argv.slice(1);
            const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
            const approvals = readJson(approvalsPath);
            const run = readJson(runRecordPath);
            const deployments = readJson(deploymentsPath);
            const statuses = readJson(statusesPath);
            const release = readJson(releasePath);
            const request = readJson(requestPath);
            const approval = [...approvals].reverse().find(
              (record) =>
                record.state === "approved"
                && record.environments?.some(
                  (environment) => environment.name === "github-pages",
                ),
            );
            if (!approval?.user?.login) {
              throw new Error("Authenticated history has no github-pages approval.");
            }
            if (
              String(run.id) !== process.env.GITHUB_RUN_ID
              || Number(run.run_attempt) !== Number(process.env.GITHUB_RUN_ATTEMPT)
              || run.head_sha !== process.env.GITHUB_SHA
            ) {
              throw new Error("Authenticated workflow-run identity mismatch.");
            }
            const candidateRunAttempt = Number(release.workflow.runAttempt);
            if (
              !Number.isInteger(candidateRunAttempt)
              || candidateRunAttempt < 1
              || Number(run.run_attempt) < candidateRunAttempt
            ) {
              throw new Error(
                "Authenticated deployment attempt predates the immutable candidate.",
              );
            }
            const runPath =
              `/${process.env.GITHUB_REPOSITORY}/actions/runs/${run.id}`;
            const isCurrentRunUrl = (value) => {
              try {
                const url = new URL(value);
                return (
                  url.origin === "https://github.com"
                  && (url.pathname === runPath || url.pathname.startsWith(`${runPath}/`))
                );
              } catch {
                return false;
              }
            };
            const runStartedAt = Date.parse(run.run_started_at);
            const deploymentPairs = deployments.flatMap((deployment) => {
              if (
                deployment.sha !== process.env.GITHUB_SHA
                || deployment.environment !== "github-pages"
                || Date.parse(deployment.created_at) < runStartedAt
              ) {
                return [];
              }
              const statusGroup = statuses.find(
                (record) => record.deploymentId === deployment.id,
              );
              const status = statusGroup?.statuses.find(
                (record) =>
                  record.state === "success"
                  && record.environment === "github-pages"
                  && isCurrentRunUrl(record.log_url),
              );
              return status ? [{ deployment, status }] : [];
            });
            if (deploymentPairs.length !== 1) {
              throw new Error(
                "Expected exactly one successful github-pages deployment bound to this run attempt.",
              );
            }
            const [{ deployment, status }] = deploymentPairs;
            if (!status.environment_url) {
              throw new Error("Authenticated Pages deployment has no environment URL.");
            }
            const runUrl =
              `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/`
              + process.env.GITHUB_RUN_ID;
            const providerRecord = {
              authenticated: true,
              provider: "github-actions-api",
              environment: "github-pages",
              state: "approved",
              reviewerId: approval.user.login,
              approvalObservedAt: new Date().toISOString(),
              sourceUrl: runUrl,
              workflowRunId: String(run.id),
              workflowRunAttempt: candidateRunAttempt,
              deploymentWorkflowRunAttempt: Number(run.run_attempt),
              commitSha: run.head_sha,
              contentTreeDigestSha256: release.content.contentTreeDigest,
              treeManifestDigestSha256: request.candidate.treeManifestDigestSha256,
              deployment: {
                deploymentId: deployment.id,
                state: "success",
                environment: "github-pages",
                environmentUrl: status.environment_url,
                sourceUrl: /^https:\/\/github\.com\//u.test(status.log_url ?? "")
                  ? status.log_url
                  : runUrl,
              },
            };
            writeFileSync(outputPath, `${JSON.stringify(providerRecord, null, 2)}\n`, {
              flag: "wx",
            });
          ' \
            "$EVIDENCE_OUTPUT/approvals-api.json" \
            "$EVIDENCE_OUTPUT/run-api.json" \
            "$EVIDENCE_OUTPUT/deployments-api.json" \
            "$EVIDENCE_OUTPUT/deployment-statuses-api.json" \
            "$EVIDENCE_CANDIDATE/case-study-release.json" \
            "$EVIDENCE_REQUEST/candidate-approval-request.json" \
            "$EVIDENCE_OUTPUT/provider-history.json"

      - name: Bind provider approval and deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/case-study-approval.mjs record-environment-evidence \
            --release "$EVIDENCE_CANDIDATE/case-study-release.json" \
            --tree-manifest-digest "${{ needs.compose-pages.outputs.tree-manifest-digest }}" \
            --request "$EVIDENCE_REQUEST/candidate-approval-request.json" \
            --provider-history "$EVIDENCE_OUTPUT/provider-history.json" \
            --workflow-actor "$GITHUB_ACTOR" \
            --allow-self-approval true \
            --out "$EVIDENCE_OUTPUT/deployment-approval-evidence.json"

      - name: Upload nondeployable approval evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-approval-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-approval-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  production-smoke:
    name: Verify deployed bytes and launch journeys
    needs:
      - compose-pages
      - deploy-pages
      - record-approval-evidence
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install exact npm
        shell: bash
        run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund

      - name: Initialize ephemeral smoke path
        shell: bash
        run: printf 'SMOKE_REPORT_DIR=%s/case-study-production-smoke\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install locked production-smoke browser
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.6.2"
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: Run manifest-wide production smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-case-study-production-smoke.mjs \
            --base-url "${{ needs.deploy-pages.outputs.page-url }}" \
            --expected-commit "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "${{ needs.compose-pages.outputs.candidate-run-attempt }}" \
            --expected-content-digest "${{ needs.compose-pages.outputs.content-tree-digest }}" \
            --expected-tree-manifest-digest "${{ needs.compose-pages.outputs.tree-manifest-digest }}" \
            --playwright-module-dir site/node_modules/playwright \
            --report-dir "$SMOKE_REPORT_DIR" \
            --ci

      - name: Upload nondeployable production evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: case-study-production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/case-study-production-smoke
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
