<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pencil Blade — Evidence to Reconstruction</title>
  <desc id="desc">An editorial case-file cover for a clean-room Cocos Creator 3.8.8 and TypeScript reconstruction.</desc>

  <rect width="1200" height="630" fill="#F4F0E6"/>

