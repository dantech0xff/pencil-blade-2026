<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title description">
  <title id="title">Clean-room reconstruction ownership</title>
  <desc id="description">Reviewed contracts enter pure TypeScript domain owners, then narrow Cocos Creator adapters, six mode owners, and measured Android and H5 proof.</desc>
  <rect width="1040" height="520" fill="#f4f0e6"/>
  <g fill="none" stroke="#171a18" stroke-width="3">
    <rect x="70" y="55" width="900" height="78"/>
    <rect x="70" y="175" width="420" height="112"/>
    <rect x="550" y="175" width="420" height="112"/>
    <rect x="70" y="330" width="900" height="120"/>
    <path d="M520 133v42"/>
    <path d="M280 287v43"/>
    <path d="M760 287v43"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#171a18">
    <text x="520" y="88" text-anchor="middle" font-size="20" font-weight="700">REVIEWED BEHAVIOR CONTRACTS</text>
    <text x="520" y="113" text-anchor="middle" font-size="15">recovered · inferred · unknown remain explicit</text>
    <text x="280" y="213" text-anchor="middle" font-size="19" font-weight="700">PURE TYPESCRIPT DOMAIN</text>
    <text x="280" y="240" text-anchor="middle" font-size="15">rules · score · state · timing · ownership</text>
