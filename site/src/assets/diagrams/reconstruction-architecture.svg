    <text x="760" y="240" text-anchor="middle" font-size="15">Physics2D · scene · audio · storage</text>
    <text x="760" y="265" text-anchor="middle" font-size="15">PTM conversion at the public boundary</text>
    <text x="520" y="362" text-anchor="middle" font-size="19" font-weight="700">SIX MODE OWNERS</text>
    <text x="520" y="390" text-anchor="middle" font-size="15">Classic · Crazy · Gangnam Style</text>
    <text x="520" y="415" text-anchor="middle" font-size="15">Classic Bird · Crazy Bird · Combo Bird</text>
    <text x="520" y="480" text-anchor="middle" font-size="17" font-weight="700">DETERMINISTIC TESTS · ANDROID DEBUG · WEB MOBILE H5</text>
  </g>
  <g fill="#f2c94c" stroke="#171a18" stroke-width="2">
